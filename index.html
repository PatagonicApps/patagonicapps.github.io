<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>PatagonicApps</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" type="image/png" href="img/logo-patagonicapps-icon.png">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Roboto', sans-serif;
      margin: 0;
      background-color: #f4f4f4;
      color: #333;
    }
    header {
      background-image: url('img/banner-patagonicapps.jpg');
      background-size: cover;
      background-position: center;
      padding: 80px 20px;
      text-align: center;
      color: white;
    }
    .logo {
      max-width: 120px;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 2.5em;
      margin: 0;
    }
    p {
      font-size: 1.2em;
      margin-top: 10px;
    }
    main {
      padding: 40px 20px;
      max-width: 800px;
      margin: auto;
      background-color: white;
      box-shadow: 0 0 10px rgba(0,0,0,0.05);
    }
    h2 {
      color: #0066cc;
      margin-top: 0;
    }
    .captura {
      width: 100%;
      max-width: 600px;
      margin: 20px 0;
      border-radius: 8px;
    }
    .playstore-btn img {
      width: 160px;
    }
    footer {
      text-align: center;
      padding: 20px;
      background-color: #eee;
      font-size: 0.9em;
    }
  </style>
</head>
<body>
  <header>
    <img src="img/logo-patagonicapps.png" alt="Logo PatagonicApps" class="logo">
    <h1>PatagonicApps</h1>
    <p>Innovación en apps móviles</p>
  </header>

  <main>
    <section>
      <h2>CalculaYa</h2>
      <p>La nueva app para cálculos rápidos y eficientes.</p>
      <img src="img/captura-calculaya.png" alt="Captura CalculaYa" class="captura">
      <a href="https://play.google.com/store/apps/details?id=com.patagonicapps.calculaya" target="_blank" class="playstore-btn">
        <img src="img/google-play-badge.png" alt="Disponible en Google Play">
      </a>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 PatagonicApps - Todos los derechos reservados</p>
  </footer>
</body>
</html>
