<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>PatagonicApps</title>
  <link rel="icon" type="image/png" href="img/logo-patagonicapps-icon.png">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Roboto', sans-serif;
      margin: 0;
      background-color: #f4f4f4;
      color: #333;
    }
    header {
      background-image: url('img/banner-patagonicapps.jpg'); /* tu banner */
      background-size: cover;
      background-position: center;
      padding: 80px 20px;
      text-align: center;
      color: white;
    }
    header h1 {
      font-size: 3em;
      margin: 0;
    }
    header p {
      font-size: 1.2em;
      margin-top: 10px;
    }
    main {
      padding: 40px 20px;
      max-width: 1000px;
      margin: auto;
    }
    .apps-grid {
      display: flex;
      gap: 40px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 40px;
    }
    .app-card {
      text-align: center;
      text-decoration: none;
      color: #333;
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      transition: transform 0.2s;
      width: 200px;
    }
    .app-card:hover {
      transform: scale(1.05);
    }
    .app-icon {
      width: 120px;
      height: 120px;
      border-radius: 20px;
      margin-bottom: 15px;
    }
    footer {
      text-align: center;
      padding: 20px;
      background-color: #eee;
      font-size: 0.9em;
    }
  </style>
</head>
<body>
  <!-- Encabezado -->
  <header>
    <h1>PatagonicApps</h1>
    <p>Innovación en apps móviles</p>
  </header>

  <!-- Contenido principal -->
  <main>
    <h2 style="text-align:center;">Mis Aplicaciones</h2>
    <div class="apps-grid">
      <!-- Rival Score -->
      <a href="rival-score.html" class="app-card">
        <img src="img/Rivals_icono.png" alt="Rival Score" class="app-icon">
        <h3>Rival Score</h3>
        <p>Seguimiento de resultados deportivos</p>
      </a>

      <!-- CalculaYa -->
      <a href="calculaya.html" class="app-card">
        <img src="img/CalculaYa_icono.png" alt="CalculaYa" class="app-icon">
        <h3>CalculaYa</h3>
        <p>Cálculos rápidos y eficientes</p>
      </a>
    </div>
  </main>

  <!-- Pie de página -->
  <footer>
    <p>&copy; 2026 PatagonicApps - Todos los derechos reservados</p>
  </footer>
</body>
</html>
